name: CI

on:
  push:
    # Not main: a push there runs Deploy, which calls this workflow itself.
    # Running both meant two runs racing for one concurrency group, and the
    # loser was sometimes Deploy's copy -- which surfaces as a startup_failure
    # on Deploy rather than a cancellation, i.e. a deploy silently not
    # happening because its own test run was cancelled out from under it.
    branches-ignore: [main]
  pull_request:
  # Called by deploy.yml so production can never ship a red build.
  workflow_call:

# Superseded runs on the same branch are pointless; a queued deploy is not.
# github.workflow is the *caller's* name under workflow_call, so a run invoked
# from Deploy lands in its own group instead of contending with a standalone
# CI run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: pytest
        working-directory: backend
        run: pytest -q

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      # getJSON swallows fetch failures and returns null, and every data route
      # is cache:"no-store", so this builds without a reachable backend.
      - name: Build
        working-directory: web
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build-only on branches and PRs: catches a broken Dockerfile at review
      # time rather than halfway through a production deploy.
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
