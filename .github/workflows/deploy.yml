name: Deploy

on:
  push:
    branches: [main]
  # Manual re-run, and the way to redeploy without a code change.
  workflow_dispatch:

# Never two deploys at once, and never cancel one midway: a cancelled deploy
# leaves the stack half-swapped, which is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GHCR requires a lowercase path; the repository name is mixed-case.
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/boe-analytics-backend
  WEB_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/boe-analytics-web

jobs:
  ci:
    # Same suite that guards a PR. Deploying past a failing test is the one
    # thing an auto-deploy pipeline must not do.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit SHA, not just :latest. The SHA is what makes the
      # rollback in the deploy job a real rollback rather than a re-pull of
      # whatever :latest happens to point at now.
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.WEB_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # The VPS pulls from GHCR with this run's token; without package read it
      # authenticates fine and then 403s on the pull.
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Authorize SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no: without this,
          # anything that can answer on that address gets the deploy, the
          # registry token, and a shell on whatever it is pretending to be.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship compose file
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/boe-analytics' }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS" "mkdir -p '$DEPLOY_DIR'"
          scp -i ~/.ssh/id_deploy deploy/docker-compose.yml "$VPS:$DEPLOY_DIR/docker-compose.yml"

      - name: Release
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/boe-analytics' }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          WEB_IMAGE: ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          # Short-lived and scoped to this run — nothing long-lived is left on
          # the VPS to pull images with.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS" \
            DEPLOY_DIR="$DEPLOY_DIR" \
            BACKEND_IMAGE="$BACKEND_IMAGE" \
            WEB_IMAGE="$WEB_IMAGE" \
            REGISTRY_TOKEN="$REGISTRY_TOKEN" \
            REGISTRY_USER="$REGISTRY_USER" \
            'bash -s' < deploy/release.sh

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Deployed \`${GITHUB_SHA:0:7}\` to production" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy of \`${GITHUB_SHA:0:7}\` failed — the previous release is still serving" >> "$GITHUB_STEP_SUMMARY"
          fi
