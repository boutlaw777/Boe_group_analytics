# Production stack for BOE Analytics. Deployed to the VPS by
# .github/workflows/deploy.yml — do not edit this file on the server, the next
# deploy overwrites it.
#
# Image tags come from .env in the same directory, which the deploy writes.
# Application secrets come from backend.env / web.env, which live only on the
# VPS and are never written by CI. See deploy/README.md.
#
# No database service on purpose: DATABASE_URL points at the existing managed
# Postgres. finclone/db.py sets `search_path to boe, public` and treats public
# as the legacy DCF app's schema, so the data this app serves already lives in
# a database CI must not replace.
#
# No nginx service either: the VPS already terminates TLS and reverse-proxies.
# Both containers publish on loopback only, so nothing here is reachable from
# the internet except through that existing nginx.

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: boe-backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "127.0.0.1:8000:8000"
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${WEB_IMAGE}
    container_name: boe-web
    restart: unless-stopped
    env_file:
      - ./web.env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        # The web tier renders in server components that call the API, so
        # starting it against a backend that is still booting serves a page of
        # empty fallbacks to whoever is watching the deploy.
        condition: service_healthy
    logging: *logging
